<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control Grid Map | MapLibre GL JS</title>
    <meta name="description"
        content="Interactive full-screen map with a collapsible Control Grid toolbar — search, basemap, terrain, measure, fullscreen, minimap and more." />

    <!-- MapLibre GL JS v5.19.0 (supports globe projection) -->
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.19.0/dist/maplibre-gl.css" />
    <script src="https://unpkg.com/maplibre-gl@5.19.0/dist/maplibre-gl.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />

    <!-- React, ReactDOM, and Babel for the Global Monitor overlay -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0d0e1a;
            --surface: rgba(16, 17, 32, 0.92);
            --surface2: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.1);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.5);
            --accent: #22d3ee;
            --text: #f1f5f9;
            --muted: #64748b;
            --radius: 10px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --grid-btn-size: 42px;
            --top-bar-height: 80px;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            overflow: hidden;
        }

        /* ── Star background canvas ── */
        #star-canvas {
            position: fixed;
            top: var(--top-bar-height);
            left: 0;
            width: 100vw;
            height: calc(100vh - var(--top-bar-height));
            z-index: 0;
            background: radial-gradient(ellipse at 50% 60%, #0a0f2e 0%, #020408 70%, #000000 100%);
            pointer-events: none;
        }

        #map {
            position: absolute;
            top: var(--top-bar-height);
            left: 0;
            width: 100vw;
            height: calc(100vh - var(--top-bar-height));
            z-index: 1;
            background: transparent;
        }

        /* ═══════════════════════════════════════════
       TOP BAR
    ═══════════════════════════════════════════ */
        #top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--top-bar-height);
            background: #ffffff;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            border-bottom: 2px solid #e1e4e8;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .top-bar-logos {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .top-bar-logos img {
            max-width: 100%;
            max-height: 70px;
            object-fit: contain;
        }

        /* ═══════════════════════════════════════════
       HEADER HUD
    ═══════════════════════════════════════════ */
        #hud {
            position: fixed;
            top: var(--top-bar-height);
            left: 0;
            right: 0;
            z-index: 200;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(180deg, rgba(5, 5, 18, .9) 0%, transparent 100%);
            pointer-events: none;
        }

        .hud-icon {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            box-shadow: 0 3px 12px var(--primary-glow);
        }

        .hud-title {
            font-size: .95rem;
            font-weight: 600;
            color: #fff;
            letter-spacing: -.02em;
        }

        .hud-badge {
            font-size: .58rem;
            font-weight: 600;
            color: var(--accent);
            background: rgba(34, 211, 238, .12);
            border: 1px solid rgba(34, 211, 238, .2);
            border-radius: 20px;
            padding: 2px 8px;
            letter-spacing: .07em;
            text-transform: uppercase;
        }

        #coords {
            margin-left: auto;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: .68rem;
            color: rgba(255, 255, 255, .45);
            background: rgba(0, 0, 0, .3);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 3px 10px;
            pointer-events: none;
            white-space: nowrap;
        }

        #zoom-badge {
            font-size: .68rem;
            color: rgba(255, 255, 255, .45);
            background: rgba(0, 0, 0, .3);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 3px 10px;
            pointer-events: none;
            font-family: 'SF Mono', 'Fira Code', monospace;
        }

        /* ═══════════════════════════════════════════
       CONTROL GRID PANEL
    ═══════════════════════════════════════════ */
        #ctrl-grid-wrapper {
            position: fixed;
            top: calc(var(--top-bar-height) + 16px);
            right: 12px;
            z-index: 300;
        }

        /* Toggle button */
        #ctrl-toggle-btn {
            width: 38px;
            height: 38px;
            border-radius: 9px;
            background: var(--surface);
            border: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            color: #fff;
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow);
            transition: background .2s, transform .15s;
            margin-left: auto;
        }

        #ctrl-toggle-btn:hover {
            background: rgba(99, 102, 241, .25);
            transform: scale(1.05);
        }

        #ctrl-toggle-btn svg {
            pointer-events: none;
        }

        /* Grid panel */
        #ctrl-panel {
            margin-top: 6px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            backdrop-filter: blur(24px);
            box-shadow: var(--shadow);
            overflow: hidden;
            transform-origin: top right;
            transform: scale(.85) translateY(-10px);
            opacity: 0;
            pointer-events: none;
            transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), opacity .2s;
            min-width: 210px;
        }

        #ctrl-panel.open {
            transform: scale(1) translateY(0);
            opacity: 1;
            pointer-events: all;
        }

        .panel-header {
            padding: 10px 14px 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border);
        }

        .panel-header-title {
            font-size: .72rem;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: .08em;
            flex: 1;
        }

        .panel-header-close {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .07);
            border: none;
            cursor: pointer;
            color: var(--muted);
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s;
        }

        .panel-header-close:hover {
            background: rgba(255, 100, 100, .2);
            color: #f87171;
        }

        .panel-grid {
            display: grid;
            grid-template-columns: repeat(4, var(--grid-btn-size));
            gap: 5px;
            padding: 10px;
        }

        /* Individual control button */
        .ctrl-btn {
            width: var(--grid-btn-size);
            height: var(--grid-btn-size);
            border-radius: 8px;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: rgba(255, 255, 255, .7);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            font-size: 18px;
            transition: background .18s, transform .15s, border-color .18s, color .18s;
            position: relative;
        }

        .ctrl-btn:hover {
            background: rgba(99, 102, 241, .2);
            border-color: rgba(99, 102, 241, .4);
            color: #fff;
            transform: scale(1.06);
        }

        .ctrl-btn.active {
            background: rgba(99, 102, 241, .3);
            border-color: var(--primary);
            color: #fff;
        }

        .ctrl-btn .btn-label {
            font-size: .45rem;
            font-weight: 600;
            letter-spacing: .04em;
            text-transform: uppercase;
            color: inherit;
            line-height: 1;
        }

        /* Tooltip */
        .ctrl-btn::after {
            content: attr(data-tip);
            position: absolute;
            right: calc(100% + 8px);
            top: 50%;
            transform: translateY(-50%);
            background: #1e1f35;
            color: #e2e8f0;
            border: 1px solid var(--border);
            font-size: .65rem;
            font-weight: 500;
            padding: 4px 9px;
            border-radius: 6px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity .15s;
            z-index: 400;
        }

        .ctrl-btn:hover::after {
            opacity: 1;
        }

        /* ═══════════════════════════════════════════
       BASEMAP PICKER SUB-PANEL
    ═══════════════════════════════════════════ */
        #basemap-picker {
            position: fixed;
            top: calc(var(--top-bar-height) + 16px);
            right: 270px;
            z-index: 350;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            backdrop-filter: blur(24px);
            box-shadow: var(--shadow);
            padding: 10px;
            display: none;
            width: 360px;
            max-height: 80vh;
            overflow-y: auto;
        }

        #basemap-picker.show {
            display: block;
        }

        .bp-title {
            font-size: .68rem;
            color: var(--accent);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .07em;
            margin-bottom: 8px;
        }

        .bp-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .bp-item {
            border-radius: 7px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color .2s;
        }

        .bp-item:hover {
            border-color: var(--primary);
        }

        .bp-item.selected {
            border-color: var(--accent);
        }

        .bp-thumb {
            width: 100%;
            height: 52px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .bp-name {
            font-size: .6rem;
            font-weight: 600;
            color: var(--text);
            padding: 3px 5px 1px;
            background: rgba(0, 0, 0, .35);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bp-provider {
            font-size: .5rem;
            color: var(--muted);
            padding: 2px 5px 4px;
            background: rgba(0, 0, 0, .35);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ═══════════════════════════════════════════
       SEARCH BOX
    ═══════════════════════════════════════════ */
        #search-box {
            position: fixed;
            top: calc(var(--top-bar-height) + 16px);
            right: 270px;
            z-index: 350;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            backdrop-filter: blur(24px);
            box-shadow: var(--shadow);
            padding: 10px;
            display: none;
            width: 280px;
        }

        #search-box.show {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        #search-input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 7px;
            background: rgba(255, 255, 255, .07);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: .8rem;
            font-family: inherit;
            outline: none;
        }

        #search-input:focus {
            border-color: var(--primary);
        }

        #search-input::placeholder {
            color: var(--muted);
        }

        #search-results {
            display: flex;
            flex-direction: column;
            gap: 2px;
            max-height: 200px;
            overflow-y: auto;
        }

        .search-result-item {
            padding: 7px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: .75rem;
            color: rgba(255, 255, 255, .75);
            transition: background .15s;
        }

        .search-result-item:hover {
            background: rgba(99, 102, 241, .2);
            color: #fff;
        }

        /* ═══════════════════════════════════════════
       MEASURE TOOLTIP
    ═══════════════════════════════════════════ */
        #measure-tooltip {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 8px 18px;
            color: var(--text);
            font-size: .8rem;
            backdrop-filter: blur(16px);
            box-shadow: var(--shadow);
            display: none;
            z-index: 500;
        }

        #measure-tooltip.show {
            display: block;
        }

        /* ═══════════════════════════════════════════
       MINIMAP
    ═══════════════════════════════════════════ */
        #minimap-container {
            position: fixed;
            bottom: 40px;
            left: 12px;
            z-index: 200;
            width: 180px;
            height: 130px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            display: none;
        }

        #minimap-container.show {
            display: block;
        }

        #minimap {
            width: 100%;
            height: 100%;
        }

        /* ═══════════════════════════════════════════
       HINT PILL
    ═══════════════════════════════════════════ */
        #hint-pill {
            position: fixed;
            bottom: 24px;
            left: 50%;
            z-index: 200;
            transform: translateX(-50%) translateY(20px);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 8px 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-size: .75rem;
            backdrop-filter: blur(16px);
            box-shadow: var(--shadow);
            opacity: 0;
            animation: floatUp .6s 1.2s cubic-bezier(.34, 1.56, .64, 1) forwards;
        }

        @keyframes floatUp {
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        /* ═══════════════════════════════════════════
       MAPLIBRE OVERRIDES
    ═══════════════════════════════════════════ */
        .maplibregl-ctrl-attrib {
            background: rgba(0, 0, 0, .5) !important;
            color: rgba(255, 255, 255, .4) !important;
            font-size: .6rem !important;
            border-radius: 6px !important;
        }

        .maplibregl-ctrl-attrib a {
            color: rgba(255, 255, 255, .5) !important;
        }

        .maplibregl-ctrl-group {
            background: var(--surface) !important;
            border: 1px solid var(--border) !important;
            border-radius: 9px !important;
            box-shadow: var(--shadow) !important;
            backdrop-filter: blur(20px) !important;
        }

        .maplibregl-ctrl button {
            color: rgba(255, 255, 255, .8) !important;
        }

        .maplibregl-ctrl button:hover {
            background: rgba(99, 102, 241, .2) !important;
        }

        /* ═══════════════════════════════════════════
       FILTER BOX
    ═══════════════════════════════════════════ */
        #filter-box {
            position: fixed;
            top: calc(var(--top-bar-height) + 16px);
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            width: 380px;
            z-index: 200;
            box-shadow: var(--shadow);
            backdrop-filter: blur(20px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #filter-box.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .filter-btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
        }

        .filter-btn {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: var(--text);
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: background 0.2s;
        }

        .filter-btn:hover {
            background: rgba(99, 102, 241, 0.3);
        }

        .filter-output {
            margin-top: 12px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            font-size: 0.75rem;
            color: var(--muted);
            min-height: 44px;
            max-height: 150px;
            overflow-y: auto;
        }
    </style>
</head>

<body>

    <!-- React Globe Monitor Overlay (Hidden by default, z-index overlays the map entirely) -->
    <div id="react-globe-root" style="display: none; position: fixed; inset: 0; z-index: 999999; background: #03050f;">
    </div>

    <!-- TOP BAR -->
    <div id="top-bar">
        <div class="top-bar-logos">
            <img src="geointellab_logo.jpeg" alt="GEO-INTEL LAB Banner" />
        </div>
    </div>

    <!-- HUD -->
    <header id="hud">
        <div class="hud-icon">🗺️</div>
        <span class="hud-title">Control Grid Map</span>
        <span class="hud-badge">MapLibre GL JS</span>
        <span id="zoom-badge">Zoom 4</span>
        <span id="coords">Move cursor over map</span>
    </header>

    <!-- Stars Background -->
    <canvas id="star-canvas"></canvas>

    <!-- Map -->
    <div id="map"></div>

    <!-- Minimap -->
    <div id="minimap-container">
        <div id="minimap"></div>
    </div>

    <!-- Floating button + panel -->
    <div id="ctrl-grid-wrapper">
        <button id="ctrl-toggle-btn" title="Toggle Control Grid">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                <rect x="3" y="14" width="7" height="7" rx="1"></rect>
            </svg>
        </button>

        <div id="ctrl-panel">
            <div class="panel-header">
                <span class="panel-header-title">Control Grid</span>
                <button class="panel-header-close" id="ctrl-close-btn">✕</button>
            </div>
            <div class="panel-grid" id="panel-grid">
                <!-- Buttons injected by JS -->
            </div>
        </div>
    </div>

    <!-- Basemap Picker -->
    <div id="basemap-picker">
        <div class="bp-title">Choose Basemap</div>
        <div class="bp-grid" id="bp-grid"></div>
    </div>

    <!-- Search Box -->
    <div id="search-box">
        <input id="search-input" type="search" placeholder="Search location…" autocomplete="off" />
        <div id="search-results"></div>
    </div>

    <!-- Measure Tooltip -->
    <div id="measure-tooltip">📏 Click map to start measuring</div>

    <!-- Query Filter Box -->
    <div id="filter-box">
        <div class="bp-title">Feature Query & Filter</div>
        <div class="filter-btn-grid">
            <button class="filter-btn" id="f-btn-load">1. Load GeoJSON</button>
            <button class="filter-btn" id="f-btn-clear">2. Clear Filter</button>
            <button class="filter-btn" id="f-btn-pop">Filter: Pop &gt; 100M</button>
            <button class="filter-btn" id="f-btn-eu">Filter: Europe</button>
            <button class="filter-btn" id="f-btn-query">Query Rendered</button>
            <button class="filter-btn" id="f-btn-query-af">Query African</button>
        </div>
        <div id="f-output" class="filter-output">Awaiting action...</div>
    </div>

    <!-- Hint pill -->
    <div id="hint-pill">☰ <strong>Top-right</strong> → open Control Grid to explore all tools</div>

    <script>
        // ═══════════════════════════════════════════════════════
        //  BASEMAPS
        // ═══════════════════════════════════════════════════════
        // Helper: build a MapLibre raster style object from a tile URL template
        function rasterStyle(tileUrl, attribution) {
            return {
                version: 8,
                sources: {
                    'raster-tiles': {
                        type: 'raster',
                        tiles: [tileUrl],
                        tileSize: 256,
                        attribution: attribution || ''
                    }
                },
                layers: [{ id: 'raster-layer', type: 'raster', source: 'raster-tiles' }]
            };
        }
        // Helper for multi-subdomain tiles (MapLibre does NOT expand {s} automatically)
        function rasterStyleMulti(tileUrls, attribution) {
            return {
                version: 8,
                sources: {
                    'raster-tiles': {
                        type: 'raster',
                        tiles: tileUrls,
                        tileSize: 256,
                        attribution: attribution || ''
                    }
                },
                layers: [{ id: 'raster-layer', type: 'raster', source: 'raster-tiles' }]
            };
        }

        const BASEMAPS = [
            // ── OpenStreetMap
            {
                id: 'osm', label: 'OpenStreetMap', provider: 'OpenStreetMap',
                emoji: '🌍', isRaster: true,
                url: rasterStyle('https://tile.openstreetmap.org/{z}/{x}/{y}.png', '© OpenStreetMap contributors')
            },
            {
                id: 'osm_hot', label: 'OSM Humanitarian', provider: 'OpenStreetMap (HOT)',
                emoji: '🚨', isRaster: true,
                url: rasterStyle('https://a.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', '© OpenStreetMap contributors, HOT')
            },
            // ── CartoDB GL vector styles
            {
                id: 'carto_dark', label: 'CartoDB Dark', provider: 'CARTO',
                emoji: '🌑',
                url: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json'
            },
            {
                id: 'carto_light', label: 'CartoDB Light', provider: 'CARTO',

        // ═══════════════════════════════════════════════════════
        //  STAR BACKGROUND CANVAS — animated twinkling starfield
        // ═══════════════════════════════════════════════════════
        (function initStars() {
            const canvas = document.getElementById('star-canvas');
            const ctx = canvas.getContext('2d');
            const NUM_STARS = 320;
            const stars = [];

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            // Generate stars with random positions, sizes, speeds and base opacity
            for (let i = 0; i < NUM_STARS; i++) {
                stars.push({
                    x: Math.random(),           // 0–1 fraction of canvas width
                    y: Math.random(),           // 0–1 fraction of canvas height
                    r: Math.random() * 1.5 + 0.3, // radius 0.3–1.8px
                    baseAlpha: Math.random() * 0.6 + 0.2, // 0.2–0.8
                    alpha: 0,
                    speed: Math.random() * 0.008 + 0.002, // twinkle speed
                    phase: Math.random() * Math.PI * 2,   // start phase
                    // rare bright stars get a slight blue/white color
                    color: Math.random() > 0.85
                        ? `hsl(${210 + Math.random() * 40}, 80%, 90%)`
                        : '#ffffff',
                });
            }

            // Add a handful of larger "feature" stars
            for (let i = 0; i < 18; i++) {
                stars.push({
                    x: Math.random(), y: Math.random(),
                    r: Math.random() * 2.5 + 1.5,
                    baseAlpha: Math.random() * 0.4 + 0.15,
                    alpha: 0,
                    speed: Math.random() * 0.004 + 0.001,
                    phase: Math.random() * Math.PI * 2,
                    color: Math.random() > 0.5
                        ? `hsl(${190 + Math.random() * 60}, 70%, 85%)`
                        : `hsl(${30 + Math.random() * 20}, 80%, 90%)`, // warm gold
                });
            }

            let t = 0;
            function drawStars() {
                const W = canvas.width;
                const H = canvas.height;

                // Clear with deep-space gradient background
                const grad = ctx.createRadialGradient(W * 0.5, H * 0.6, 0, W * 0.5, H * 0.6, Math.max(W, H) * 0.85);
                grad.addColorStop(0, '#081028');
                grad.addColorStop(0.45, '#030810');
                grad.addColorStop(1, '#000000');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                t += 0.016;

                for (const s of stars) {
                    // Smooth sinusoidal twinkle
                    s.alpha = s.baseAlpha * (0.55 + 0.45 * Math.sin(t * s.speed * 60 + s.phase));

                    const px = s.x * W;
                    const py = s.y * H;

                    // Glow halo for larger stars
                    if (s.r > 1.2) {
                        const glow = ctx.createRadialGradient(px, py, 0, px, py, s.r * 5);
                        glow.addColorStop(0, s.color.replace(')', `, ${s.alpha * 0.5})`).replace('hsl', 'hsla').replace('rgb', 'rgba'));
                        glow.addColorStop(1, 'rgba(0,0,0,0)');
                        ctx.beginPath();
                        ctx.arc(px, py, s.r * 5, 0, Math.PI * 2);
                        ctx.fillStyle = glow;
                        ctx.fill();
                    }

                    // Core star dot
                    ctx.beginPath();
                    ctx.arc(px, py, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${s.alpha})`;
                    ctx.fill();
                }

                requestAnimationFrame(drawStars);
            }

            drawStars();
        })();

        toggleBtn.addEventListener('pointerdown', (e) => {
            // Only left clicks or primary touch
            if (e.button !== 0 && e.pointerType === 'mouse') return;
            isDraggingWrapper = false;
            dragOrigin = { x: e.clientX, y: e.clientY };

            const rect = wrapper.getBoundingClientRect();
            wrapperOrigin = { left: rect.left, top: rect.top };
            toggleBtn.setPointerCapture(e.pointerId);
            toggleBtn.style.cursor = 'grabbing';
        });

        toggleBtn.addEventListener('pointermove', (e) => {
            if (!toggleBtn.hasPointerCapture(e.pointerId)) return;

            const dx = e.clientX - dragOrigin.x;
            const dy = e.clientY - dragOrigin.y;

            if (!isDraggingWrapper && (Math.abs(dx) > 3 || Math.abs(dy) > 3)) {
                isDraggingWrapper = true;
                // Switch positioning mode to avoid conflict with initial 'right/top' CSS CSS
                wrapper.style.right = 'auto';
                wrapper.style.bottom = 'auto';

            if (isDraggingWrapper) {
                wrapper.style.left = (wrapperOrigin.left + dx) + 'px';
                wrapper.style.top = (wrapperOrigin.top + dy) + 'px';
            }
        });

        function startMeasure() {
            measurePoints = [];

            map.getCanvas().style.cursor = 'crosshair';

        function stopMeasure() {
            isMeasuring = false;
            setActive('measure', false);
            map.getCanvas().style.cursor = '';
            map.off('click', onMeasureClick);
            document.getElementById('measure-tooltip').classList.remove('show');
            measureMarkers.forEach(m => m.remove());
            measureMarkers = [];
            if (map.getSource('measure-line')) { map.removeLayer('measure-line-layer'); map.removeSource('measure-line'); }
        }

        function onMeasureClick(e) {
            const pt = [e.lngLat.lng, e.lngLat.lat];
            measurePoints.push(pt);

            const mk = new maplibregl.Marker({ color: '#6366f1' }).setLngLat(pt).addTo(map);
            measureMarkers.push(mk);

            if (measurePoints.length >= 2) {
                drawMeasureLine();
                const dist = haversine(measurePoints[measurePoints.length - 2], pt);
                const total = totalDistance();
                document.getElementById('measure-tooltip').textContent = `📏 Last: ${dist.toFixed(2)} km · Total: ${total.toFixed(2)} km  (click to continue, ✕ to stop)`;
            } else {
                document.getElementById('measure-tooltip').textContent = '📏 Click to place second point';
            }
        }

        function drawMeasureLine() {
            const geom = { type: 'Feature', geometry: { type: 'LineString', coordinates: measurePoints } };
            if (map.getSource('measure-line')) {
                map.getSource('measure-line').setData(geom);
            } else {
                map.addSource('measure-line', { type: 'geojson', data: geom });
                map.addLayer({
                    id: 'measure-line-layer', type: 'line', source: 'measure-line',
                    paint: { 'line-color': '#6366f1', 'line-width': 2, 'line-dasharray': [2, 1] }
                });
            }
        }

        function haversine([lon1, lat1], [lon2, lat2]) {
            const R = 6371, dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }
        function totalDistance() {
            let d = 0; for (let i = 1; i < measurePoints.length; i++) d += haversine(measurePoints[i - 1], measurePoints[i]); return d;
        }

            container.classList.toggle('show', isMinimapOn);
            setActive('minimap', isMinimapOn);

            if (isMinimapOn && !minimapMap) {
                minimapMap = new maplibregl.Map({
                    container: 'minimap',
                    style: BASEMAPS[0].url,
                    center: map.getCenter(),
                    zoom: map.getZoom() - 3,
                    interactive: false,
                    attributionControl: false,
                });
            }
            if (isMinimapOn) {
                map.on('move', syncMinimap);
            } else {
                map.off('move', syncMinimap);
            }
        }
        function syncMinimap() {
            if (minimapMap) minimapMap.setCenter(map.getCenter());
        }

        // 10. Zoom In/Out — handled inline

        // 12. Home
        function goHome() { map.flyTo({ center: [78.9629, 20.5937], zoom: 4, pitch: 0, bearing: 0, duration: 1200 }); }

        // 13. Rotate
        function rotateBearing() { map.easeTo({ bearing: (map.getBearing() + 45) % 360, duration: 400 }); }

        // 14. Tilt
        let pitchIndex = 0;
        const pitches = [0, 30, 60];
        function togglePitch() {
            pitchIndex = (pitchIndex + 1) % pitches.length;
            map.easeTo({ pitch: pitches[pitchIndex], duration: 500 });
        }

        // 15. Print
        function printMap() {
            map.once('idle', () => {
                const canvas = map.getCanvas();
                const win = window.open('');
                win.document.write(`<img src="${canvas.toDataURL()}" style="width:100%;max-width:100%"/>`);
                win.document.close();
                setTimeout(() => { win.print(); }, 500);
            });
            map.triggerRepaint();
        }

        // 16. Fit world
        function fitWorld() { map.fitBounds([[-180, -85], [180, 85]], { padding: 20, duration: 800 }); }

        // Close subpanels when clicking map
        map.on('click', () => {
            if (!isMeasuring) {
                document.getElementById('basemap-picker').classList.remove('show');
                document.getElementById('search-box').classList.remove('show');
                document.getElementById('filter-box').classList.remove('show');
            }
        });

        // 17. Query Filter Tool logic
        let isFilterActive = false;
        let countriesLoaded = false;

        function stopFilter() {
            isFilterActive = false;
            setActive('query_filter', false);
            document.getElementById('filter-box').classList.remove('show');

            if (map.getLayer("countries")) map.removeLayer("countries");
            if (map.getSource("countries")) map.removeSource("countries");

            countriesLoaded = false;
            const fOut = document.getElementById('f-output');
            if (fOut) fOut.innerHTML = "Awaiting action...";
        }

        function toggleFilterBox() {
            if (!isFilterActive) {
                closeAllSubPanels();
                isFilterActive = true;
                document.getElementById('filter-box').classList.add('show');
                setActive('query_filter', true);
            } else {
                // When toggled off, cleanly remove everything
                stopFilter();
            }
        }

        const fOutput = document.getElementById('f-output');

        document.getElementById('f-btn-load').addEventListener('click', () => {
            if (countriesLoaded) {
                fOutput.innerHTML = "GeoJSON already loaded for this basemap.";
                return;
            }
            if (!map.getSource("countries")) {
                map.addSource("countries", {
                    type: "geojson",
                    data: "https://d2ad6b4ur7yvpq.cloudfront.net/naturalearth-3.3.0/ne_110m_admin_0_countries.geojson"
                });
            }
            if (!map.getLayer("countries")) {
                map.addLayer({
                    id: "countries",
                    type: "fill",
                    source: "countries",
                    paint: {
                        "fill-color": "#627BC1",
                        "fill-opacity": 0.5,
                        "fill-outline-color": "#333",
                    }
                });
            }
            countriesLoaded = true;
            fOutput.innerHTML = "Loaded countries GeoJSON data.";
            map.flyTo({ zoom: 1, duration: 2000 });
        });

        document.getElementById('f-btn-pop').addEventListener('click', () => {
            if (!countriesLoaded) return fOutput.innerHTML = "Load GeoJSON first.";
            map.setFilter("countries", [">", ["get", "pop_est"], 100000000]);
            fOutput.innerHTML = "Filter applied: Population > 100 Million.";
        });

        document.getElementById('f-btn-eu').addEventListener('click', () => {
            if (!countriesLoaded) return fOutput.innerHTML = "Load GeoJSON first.";
            map.setFilter("countries", ["==", ["get", "continent"], "Europe"]);
            fOutput.innerHTML = "Filter applied: Europe Only.";
        });

        document.getElementById('f-btn-clear').addEventListener('click', () => {
            if (!countriesLoaded) return fOutput.innerHTML = "Load GeoJSON first.";
            map.setFilter("countries", null);
            fOutput.innerHTML = "Filter cleared: Showing all.";
        });

        document.getElementById('f-btn-query').addEventListener('click', () => {
            if (!countriesLoaded) return fOutput.innerHTML = "Load GeoJSON first.";
            const features = map.queryRenderedFeatures({ layers: ["countries"] });
            const unique = new Set(features.map(f => f.properties.name || "Unknown"));
            fOutput.innerHTML = `Rendered Features (${unique.size}):<br/>` + Array.from(unique).slice(0, 5).join(", ") + (unique.size > 5 ? "..." : "");
        });

        document.getElementById('f-btn-query-af').addEventListener('click', () => {
            if (!countriesLoaded) return fOutput.innerHTML = "Load GeoJSON first.";
            const features = map.queryRenderedFeatures({
                layers: ["countries"],
                filter: ["==", ["get", "continent"], "Africa"]
            });
            const unique = new Set(features.map(f => f.properties.name || "Unknown"));
            fOutput.innerHTML = `African countries in viewport (${unique.size}):<br/>` + Array.from(unique).slice(0, 5).map(v => " - " + v).join("<br/>");
        });
    </script>

    <!-- React Global Monitor Code -->
    <script type="text/babel">
        const { useEffect, useRef, useState } = React;

        const CITIES = [
            { name: "Tokyo", country: "Japan", lat: 35.6762, lng: 139.6503, tz: "Asia/Tokyo" },
            { name: "New York", country: "USA", lat: 40.7128, lng: -74.006, tz: "America/New_York" },
            { name: "London", country: "UK", lat: 51.5074, lng: -0.1278, tz: "Europe/London" },
            { name: "Sydney", country: "Australia", lat: -33.8688, lng: 151.2093, tz: "Australia/Sydney" },
            { name: "Dubai", country: "UAE", lat: 25.2048, lng: 55.2708, tz: "Asia/Dubai" },
            { name: "São Paulo", country: "Brazil", lat: -23.5505, lng: -46.6333, tz: "America/Sao_Paulo" },
            { name: "Mumbai", country: "India", lat: 19.076, lng: 72.8777, tz: "Asia/Kolkata" },
            { name: "Paris", country: "France", lat: 48.8566, lng: 2.3522, tz: "Europe/Paris" },
            { name: "Cairo", country: "Egypt", lat: 30.0444, lng: 31.2357, tz: "Africa/Cairo" },
            { name: "Toronto", country: "Canada", lat: 43.6532, lng: -79.3832, tz: "America/Toronto" },
        ];

        function latLngToXY(lat, lng, cx, cy, r, rotation) {
            const lngRad = ((lng + rotation) * Math.PI) / 180;
            const latRad = (lat * Math.PI) / 180;
            const x = cx + r * Math.cos(latRad) * Math.sin(lngRad);
            const y = cy - r * Math.sin(latRad);
            const z = Math.cos(latRad) * Math.cos(lngRad);
            return { x, y, z };
        }

        function generateGraticule(cx, cy, r, rotation) {
            const lines = [];
            for (let lat = -60; lat <= 60; lat += 30) {
                const pts = [];
                for (let lng = -180; lng <= 180; lng += 5) {
                    const { x, y, z } = latLngToXY(lat, lng, cx, cy, r, rotation);
                    if (z > 0) pts.push(`${x},${y}`);
                    else if (pts.length > 0) {
                        lines.push(pts.join(" "));
                        pts.length = 0;
                    }
                }
                if (pts.length > 1) lines.push(pts.join(" "));
            }
            for (let lng = -180; lng < 180; lng += 30) {
                const pts = [];
                for (let lat = -90; lat <= 90; lat += 3) {
                    const { x, y, z } = latLngToXY(lat, lng, cx, cy, r, rotation);
                    if (z > 0) pts.push(`${x},${y}`);
                    else if (pts.length > 0) {
                        lines.push(pts.join(" "));
                        pts.length = 0;
                    }
                }
                if (pts.length > 1) lines.push(pts.join(" "));
            }
            return lines;
        }

        function Globe() {
            const [activeCity, setActiveCity] = useState(0);
            const [times, setTimes] = useState({});
            const [hovered, setHovered] = useState(null);
            const [basemapIndex, setBasemapIndex] = useState(2); // Default carto_dark
            const SIZE = 520;

            const [isVisible, setIsVisible] = useState(false);
            const mapRef = useRef(null);
            const mapContainer = useRef(null);
            const animRef = useRef(null);
            const markersRef = useRef([]);

            useEffect(() => {
                const rootEl = document.getElementById('react-globe-root');
                const observer = new MutationObserver(() => {
                    setIsVisible(rootEl.style.display !== 'none');
                });
                observer.observe(rootEl, { attributes: true, attributeFilter: ['style'] });
                return () => observer.disconnect();
            }, []);

            useEffect(() => {
                if (!isVisible) return;
                const update = () => {
                    const now = new Date();
                    const t = {};
                    CITIES.forEach((c) => {
                        t[c.name] = now.toLocaleTimeString("en-US", { timeZone: c.tz, hour: "2-digit", minute: "2-digit", second: "2-digit" });
                    });
                    setTimes(t);
                };
                update();
                const id = setInterval(update, 1000);
                return () => clearInterval(id);
            }, [isVisible]);

            // Auto-shift removed as requested
            // Initialize MapLibre
            useEffect(() => {
                if (!isVisible || mapRef.current || !mapContainer.current) return;

                const bm = window.BASEMAPS && window.BASEMAPS.length > basemapIndex ? window.BASEMAPS[basemapIndex] : window.BASEMAPS[0];

                const map = new maplibregl.Map({
                    container: mapContainer.current,
                    style: bm.url,
                    center: [0, 15],
                    zoom: 1.15,
                    interactive: true,
                    attributionControl: false,
                });
                mapRef.current = map;

                map.on('style.load', () => {
                    map.setProjection({ type: 'globe' });
                });

                return () => {
                    if (animRef.current) cancelAnimationFrame(animRef.current);
                    if (mapRef.current) {
                        mapRef.current.remove();
                        mapRef.current = null;
                    }
                };
            }, [isVisible]);

            // Handle Basemap changes
            useEffect(() => {
                if (!mapRef.current || !isVisible) return;
                const bm = window.BASEMAPS[basemapIndex];
                mapRef.current.setStyle(bm.url);
                mapRef.current.once('style.load', () => {
                    mapRef.current.setProjection({ type: 'globe' });
                });
            }, [basemapIndex, isVisible]);

            // MapLibre Markers
            useEffect(() => {
                if (!mapRef.current || !isVisible) return;
                const map = mapRef.current;

                markersRef.current.forEach(m => m.remove());
                markersRef.current = [];

                CITIES.forEach((c, i) => {
                    const isActive = i === activeCity;
                    const el = document.createElement('div');
                    el.style.width = isActive ? '12px' : '6px';
                    el.style.height = isActive ? '12px' : '6px';
                    el.style.background = isActive ? '#2af' : '#7df';
                    el.style.borderRadius = '50%';
                    el.style.boxShadow = isActive ? '0 0 10px #2af, 0 0 20px #2af' : 'none';
                    el.style.transition = 'all 0.3s';
                    el.style.position = 'relative';
                    el.style.cursor = 'pointer';

                    if (isActive) {
                        const pulse = document.createElement('div');
                        pulse.style.width = '24px';
                        pulse.style.height = '24px';
                        pulse.style.border = '1px solid #2af';
                        pulse.style.borderRadius = '50%';
                        pulse.style.position = 'absolute';
                        pulse.style.left = '-7px';
                        pulse.style.top = '-7px';
                        pulse.style.animation = 'pulse-ring 1.5s ease-out infinite';
                        el.appendChild(pulse);
                    }

                    el.addEventListener('mouseenter', () => { setHovered(i); setActiveCity(i); });
                    el.addEventListener('mouseleave', () => setHovered(null));

                    const marker = new maplibregl.Marker({ element: el })
                        .setLngLat([c.lng, c.lat])
                        .addTo(map);
                    markersRef.current.push(marker);
                });
            }, [activeCity, isVisible]);

            const city = CITIES[activeCity];

            if (!isVisible) return null;

            return (
                <div style={{
                    position: "fixed",
                    inset: 0,
                    background: "#03050f",
                    fontFamily: "'Courier New', monospace",
                    overflow: "hidden",
                    zIndex: 9999
                }}>
                    <button
                        onClick={() => document.getElementById('react-globe-root').style.display = 'none'}
                        style={{
                            position: "absolute", top: 24, right: 32, zIndex: 10,
                            background: "rgba(34,170,255,0.1)", border: "1px solid #2af",
                            color: "#e8f4ff", padding: "10px 20px", borderRadius: 4,
                            cursor: "pointer", fontFamily: "'Courier New', monospace",
                            fontWeight: "bold", letterSpacing: "0.1em", textTransform: "uppercase",
                            boxShadow: "0 0 10px rgba(34,170,255,0.3)"
                        }}
                    >
                        ✕ Close Monitor
                    </button>

                    <style>{`
                        @keyframes twinkle {
                            0%, 100% { opacity: 0.1; }
                            50% { opacity: 0.9; }
                        }
                        @keyframes pulse-ring {
                            0% { transform: scale(1); opacity: 1; }
                            100% { transform: scale(3); opacity: 0; }
                        }
                        @keyframes fade-slide-up {
                            from { opacity: 0; transform: translateY(16px); }
                            to { opacity: 1; transform: translateY(0); }
                        }
                        @keyframes scan {
                            0% { top: 10%; opacity: 0.6; }
                            100% { top: 90%; opacity: 0; }
                        }
                        .monitor-map-container {
                            position: absolute;
                            inset: 0;
                            z-index: 1;
                        }
                        .monitor-map-container .maplibregl-canvas {
                            background: transparent !important;
                        }
                    `}</style>

                    {/* MapLibre instance container */}
                    <div
                        ref={mapContainer}
                        className="monitor-map-container"
                        style={{
                            background: "radial-gradient(circle at center, #1a3a6e 0%, #0b1e40 60%, #040c1e 100%)"
                        }}
                    />

                    {/* Active city info - Floating Bottom Left */}
                    <div key={activeCity} style={{
                        position: "absolute",
                        bottom: 32,
                        left: 32,
                        zIndex: 2,
                        textAlign: "left",
                        animation: "fade-slide-up 0.5s ease",
                        background: "rgba(3, 5, 15, 0.6)",
                        padding: "20px",
                        border: "1px solid #1a3a5e",
                        borderRadius: "8px",
                        backdropFilter: "blur(4px)"
                    }}>
                        <div style={{ fontSize: 13, letterSpacing: "0.35em", color: "#4af", textTransform: "uppercase", marginBottom: 4 }}>
                            {city.country}
                        </div>
                        <div style={{ fontSize: 32, fontWeight: 900, color: "#e8f4ff", letterSpacing: "0.1em", textTransform: "uppercase", textShadow: "0 0 20px #2af8" }}>
                            {city.name}
                        </div>
                        <div style={{ fontSize: 26, color: "#2af", fontVariantNumeric: "tabular-nums", letterSpacing: "0.05em", marginTop: 4 }}>
                            {times[city.name] || "--:--:--"}
                        </div>
                        <div style={{ marginTop: 6, fontSize: 10, color: "#4af8", letterSpacing: "0.3em" }}>
                            {city.lat > 0 ? city.lat.toFixed(2) + "°N" : Math.abs(city.lat).toFixed(2) + "°S"}
                            {"  "}
                            {city.lng > 0 ? city.lng.toFixed(2) + "°E" : Math.abs(city.lng).toFixed(2) + "°W"}
                        </div>
                    </div>

                    {/* Right Side Controls - Floating Bottom Right */}
                    <div style={{
                        position: "absolute",
                        bottom: 32,
                        right: 32,
                        zIndex: 2,
                        display: "flex",
                        flexDirection: "column",
                        gap: 16,
                        alignItems: "flex-end"
                    }}>
                        {/* City Status Legend */}
                        <div style={{
                            display: "flex", gap: 6, flexWrap: "wrap", justifyContent: "flex-end", maxWidth: 400,
                            background: "rgba(3, 5, 15, 0.6)", padding: "12px", borderRadius: "8px", border: "1px solid #1a3a5e",
                            backdropFilter: "blur(4px)"
                        }}>
                            {CITIES.map((c, i) => (
                                <button key={c.name}
                                    onClick={() => setActiveCity(i)}
                                    style={{
                                        background: activeCity === i ? "rgba(34,170,255,0.15)" : "transparent",
                                        border: `1px solid ${activeCity === i ? "#2af" : "#1a3a5e"}`,
                                        color: activeCity === i ? "#2af" : "#4a7a9a",
                                        padding: "4px 8px", borderRadius: 4,
                                        fontSize: 10, letterSpacing: "0.1em", textTransform: "uppercase",
                                        cursor: "pointer", transition: "all 0.2s",
                                    }}>
                                    {c.name}
                                </button>
                            ))}
                        </div>

                        {/* Monitor Basemap Picker */}
                        <div style={{
                            display: "flex", gap: 5, rowGap: 6, flexWrap: "wrap", justifyContent: "flex-end", maxWidth: 400,
                            background: "rgba(3, 5, 15, 0.6)", padding: "12px", border: "1px solid #1a3a5e", borderRadius: "8px",
                            backdropFilter: "blur(4px)"
                        }}>
                            <div style={{ width: "100%", textAlign: "right", fontSize: 10, letterSpacing: "0.2em", color: "#4af", textTransform: "uppercase", marginBottom: 4 }}>
                                Base Map Source
                            </div>
                            {(window.BASEMAPS || []).map((bm, i) => (
                                <button key={bm.id}
                                    onClick={() => setBasemapIndex(i)}
                                    style={{
                                        background: basemapIndex === i ? "rgba(34,170,255,0.2)" : "rgba(20,25,35,0.6)",
                                        border: `1px solid ${basemapIndex === i ? "#2af" : "#1a3a5e"}`,
                                        color: basemapIndex === i ? "#fff" : "#7aa",
                                        padding: "4px 8px", borderRadius: 4,
                                        fontSize: 10, cursor: "pointer", transition: "all 0.2s",
                                    }}>
                                    {bm.emoji} {bm.label}
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        const rootBase = ReactDOM.createRoot(document.getElementById('react-globe-root'));
        rootBase.render(<Globe />);
    </script>
